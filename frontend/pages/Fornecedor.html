<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Fornecedor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Menu lateral -->
        <div class="col-2 bg-dark text-white min-vh-100 p-3 d-flex flex-column">

            <h3>Mercado</h3>

            <hr>

            <a href="Dashboard.html" class="d-block text-white mb-3">Dashboard</a>
            <a href="Pdv.html" class="d-block text-white mb-3">PDV - Vendas</a>
            <a href="Produtos.html" class="d-block text-white mb-3">Produtos</a>
            <a href="Estoque.html" class="d-block text-white mb-3">Estoque</a>
            <a href="Fornecedor.html" class="d-block text-white fw-bold">Fornecedor</a>

            <div class="mt-auto pt-3">
                <hr>
                <small id="usuarioLogado" class="d-block mb-2 text-white-50">Carregando...</small>
                <button onclick="sair()" class="btn btn-outline-light btn-sm w-100">Sair</button>
            </div>

        </div>


        <!-- CONTEÚDO -->
        <div class="col-10 p-4">

            <h1>Fornecedor</h1>

            <hr>

            <div id="mensagemErro" class="alert alert-danger d-none" role="alert"></div>
            <div id="mensagemSucesso" class="alert alert-success d-none" role="alert"></div>


            <!-- FORMULÁRIO -->
            <h2 id="tituloFormulario">Adicionar Fornecedor</h2>

            <form id="formFornecedor" class="row g-3">

                <input type="hidden" id="fornecedorId">

                <div class="col-md-8">
                    <label class="form-label">Nome do Fornecedor</label>
                    <input type="text" id="nome" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">CNPJ</label>
                    <input type="text" id="cnpj" class="form-control" placeholder="00.000.000/0000-00" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Telefone</label>
                    <input type="tel" id="telefone" class="form-control">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Cidade</label>
                    <input type="text" id="cidade" class="form-control">
                </div>

                <div class="col-md-2">
                    <label class="form-label">UF</label>
                    <input type="text" id="estado" class="form-control" maxlength="2" placeholder="PE">
                </div>

                <div class="col-12">
                    <label class="form-label">Descrição</label>
                    <input type="text" id="descricao" class="form-control" placeholder="Ex: Entrega semanal às terças e quintas">
                </div>

                <div class="col-12">
                    <button type="submit" id="botaoSalvar" class="btn btn-primary">Cadastrar</button>
                    <button type="button" id="botaoCancelar" class="btn btn-secondary d-none">Cancelar edição</button>
                </div>

            </form>

            <hr class="my-4">

            <!-- LISTAGEM -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="mb-0">Fornecedores cadastrados</h2>
                <input type="search" id="campoBusca" class="form-control w-25" placeholder="Buscar fornecedor...">
            </div>

            <table class="table table-bordered table-hover">
                <thead>
                    <tr>
                        <th>CNPJ</th>
                        <th>Fornecedor</th>
                        <th>Contato</th>
                        <th>Localização</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="corpoFornecedores">
                    <tr><td colspan="5" class="text-center text-muted">Carregando...</td></tr>
                </tbody>
            </table>

        </div>

    </div>

</div>

<script src="../js/api/api.js"></script>
<script src="../js/util.js"></script>
<script src="../js/auth/session.js"></script>
<script src="../js/fornecedores/fornecedores.js"></script>

</body>
</html>
