<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Produtos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Menu lateral -->
        <div class="col-2 bg-dark text-white min-vh-100 p-3 d-flex flex-column">

            <h3>Mercado</h3>

            <hr>

            <a href="Dashboard.html" class="d-block text-white mb-3">Dashboard</a>
            <a href="Pdv.html" class="d-block text-white mb-3">PDV - Vendas</a>
            <a href="Produtos.html" class="d-block text-white mb-3 fw-bold">Produtos</a>
            <a href="Estoque.html" class="d-block text-white mb-3">Estoque</a>
            <a href="Fornecedor.html" class="d-block text-white">Fornecedor</a>

            <div class="mt-auto pt-3">
                <hr>
                <small id="usuarioLogado" class="d-block mb-2 text-white-50">Carregando...</small>
                <button onclick="sair()" class="btn btn-outline-light btn-sm w-100">Sair</button>
            </div>

        </div>


        <!-- CONTEÚDO -->
        <div class="col-10 p-4">

            <h1>Produtos</h1>
            <p class="text-muted">Catálogo de consulta. Para cadastrar ou editar produtos, acesse a tela de Estoque.</p>

            <hr>

            <div id="mensagemErro" class="alert alert-danger d-none" role="alert"></div>

            <div class="row mb-4 g-2">
                <div class="col-md-6">
                    <input type="search" id="campoBusca" class="form-control" placeholder="Buscar por nome, marca ou código...">
                </div>
                <div class="col-md-4">
                    <select id="filtroCategoria" class="form-select">
                        <option value="">Todas as categorias</option>
                    </select>
                </div>
            </div>

            <div id="grade" class="row g-3">
                <p class="text-muted">Carregando produtos...</p>
            </div>

        </div>

    </div>

</div>

<script src="../js/api/api.js"></script>
<script src="../js/util.js"></script>
<script src="../js/auth/session.js"></script>
<script src="../js/produtos/produtos.js"></script>

</body>
</html>
