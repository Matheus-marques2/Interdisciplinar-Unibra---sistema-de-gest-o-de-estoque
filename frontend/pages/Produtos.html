<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Produtos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cinza-escuro: #1f3d2e;
            --cinza: #3f7a57;
        }

        /* ---------- Sidebar ---------- */
        .sidebar { font-family: 'DM Sans', system-ui, sans-serif;
            background: var(--cinza-escuro);
            color: #fff;
        }

        @media (min-width: 992px) {
            .sidebar { position: sticky; top: 0; height: 100vh; }
        }

        .marca {
            font-size: 1.35rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: .6rem;
        }

        .marca i {
            background: var(--cinza);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-size: 1.1rem;
        }

        .menu-link {
            display: flex;
            align-items: center;
            gap: .75rem;
            padding: .65rem .85rem;
            border-radius: 10px;
            color: rgba(255, 255, 255, .72);
            text-decoration: none;
            font-weight: 500;
            transition: background .15s, color .15s;
        }

        .menu-link:hover { background: rgba(255, 255, 255, .08); color: #fff; }

        .menu-link.ativo {
            background: #fff;
            color: var(--cinza-escuro);
            font-weight: 700;
        }

        .menu-link:focus-visible,
        .sidebar .btn:focus-visible { outline: 3px solid #a9d4b9; outline-offset: 2px; }

        .usuario {
            background: rgba(255, 255, 255, .07);
            border-radius: 12px;
            padding: .8rem;
        }
    </style>
</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Menu lateral -->
        <aside class="col-12 col-lg-2 sidebar p-3 d-flex flex-column">

            <div class="marca mb-3 mb-lg-4">
                <i class="bi bi-basket2-fill"></i>
                <span>Mercado</span>
            </div>

            <nav class="d-flex flex-row flex-lg-column flex-wrap gap-1" aria-label="Menu principal">
                <a href="Dashboard.html" class="menu-link"><i class="bi bi-speedometer2"></i>Dashboard</a>
                <a href="Pdv.html" class="menu-link"><i class="bi bi-cart3"></i>PDV - Vendas</a>
                <a href="Produtos.html" class="menu-link ativo"><i class="bi bi-box-seam"></i>Produtos</a>
                <a href="Estoque.html" class="menu-link"><i class="bi bi-boxes"></i>Estoque</a>
                <a href="Fornecedor.html" class="menu-link"><i class="bi bi-truck"></i>Fornecedor</a>
            </nav>

            <div class="mt-3 mt-lg-auto">
                <div class="usuario">
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <i class="bi bi-person-circle fs-4"></i>
                        <small id="usuarioLogado" class="text-white-50">Carregando...</small>
                    </div>
                    <button onclick="sair()" class="btn btn-outline-light btn-sm w-100">
                        <i class="bi bi-box-arrow-right me-1"></i>Sair
                    </button>
                </div>
            </div>

        </aside>


        <!-- CONTEÚDO -->
        <div class="col-12 col-lg-10 p-4">

            <h1>Produtos</h1>
            <p class="text-muted">Catálogo de consulta. Para cadastrar ou editar produtos, acesse a tela de Estoque.</p>

            <hr>

            <div id="mensagemErro" class="alert alert-danger d-none" role="alert"></div>

            <div class="row mb-4 g-2">
                <div class="col-md-6">
                    <input type="search" id="campoBusca" class="form-control" placeholder="Buscar por nome, marca ou código...">
                </div>
                <div class="col-md-4">
                    <select id="filtroCategoria" class="form-select">
                        <option value="">Todas as categorias</option>
                    </select>
                </div>
            </div>

            <div id="grade" class="row g-3">
                <p class="text-muted">Carregando produtos...</p>
            </div>

        </div>

    </div>

</div>

<script src="../js/api/api.js"></script>
<script src="../js/util.js"></script>
<script src="../js/auth/session.js"></script>
<script src="../js/produtos/produtos.js"></script>

</body>
</html>
