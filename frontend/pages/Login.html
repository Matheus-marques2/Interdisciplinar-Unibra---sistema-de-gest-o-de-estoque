<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Login - Mercado</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="col-md-4">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h3 class="text-center mb-4">Mercado</h3>
                    <p class="text-center text-muted mb-4">Entre com sua conta</p>

                    <div id="mensagemErro" class="alert alert-danger d-none" role="alert"></div>

                    <form id="formLogin">

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" required autofocus>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Senha</label>
                            <input type="password" id="senha" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Entrar</button>

                    </form>

                    <p class="text-center mt-3 mb-0">
                        Não tem conta? <a href="Cadastro.html">Cadastre-se</a>
                    </p>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="../js/api/api.js"></script>
<script src="../js/auth/login.js"></script>

</body>
</html>
