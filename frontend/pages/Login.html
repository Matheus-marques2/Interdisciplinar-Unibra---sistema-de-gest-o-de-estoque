<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Mercado</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body { background: #1f3d2e; }
        .logo { width: 56px; height: 56px; background: #ffd23f; color: #0f4d2a; font-size: 1.7rem; }
        .btn-verde { background: #1f7a3e; color: #fff; }
        .btn-verde:hover { background: #0f4d2a; color: #fff; }
        a { color: #1f7a3e; }
    </style>
</head>

<body>

<div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card border-0 shadow w-100" style="max-width: 380px;">
        <div class="card-body p-4">

            <div class="text-center mb-4">
                <div class="logo rounded-circle d-inline-flex align-items-center justify-content-center mb-2">
                    <i class="bi bi-basket2-fill"></i>
                </div>
                <h3 class="fw-bold mb-0">MercaFácil</h3>
                <p class="text-muted mb-0">Entre com sua conta</p>
            </div>

            <div id="mensagemErro" class="alert alert-danger d-none" role="alert"></div>

            <form id="formLogin">
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="email" class="form-control" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="senha">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" id="senha" class="form-control" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-verde w-100">Entrar</button>
            </form>

            <p class="text-center mt-3 mb-0">
                Não tem conta? <a href="Cadastro.html">Cadastre-se</a>
            </p>

        </div>
    </div>
</div>

<script src="../js/api/api.js"></script>
<script src="../js/auth/login.js"></script>

</body>
</html>
