<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Dashboard Mercado</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->
        <div class="col-2 bg-dark text-white min-vh-100 p-3">

            <h3>Mercado</h3>

            <hr>

            <a href="" class="d-block text-white mb-3">
                Dashboard
            </a>

            <a href="Estoque.html" class="d-block text-white mb-3">
                Estoque
            </a>

            <a href="Fornecedor.html" class="d-block text-white">
                Fornecedor
            </a>

        </div>


        <!-- Conteúdo -->
        <div class="col-10 p-4">

            <h1>Dashboard</h1>

            <hr>

            <!-- Cards -->
            <div class="row">

                <div class="col">
                    <div class="card p-3">
                        <h5>Vendas hoje</h5>
                        <h3>R$ 5.000</h3>
                    </div>
                </div>

                <div class="col">
                    <div class="card p-3">
                        <h5>Produtos em estoque</h5>
                        <h3>250</h3>
                    </div>
                </div>

                <div class="col">
                    <div class="card p-3">
                        <h5>Fornecedores</h5>
                        <h3>23</h3>
                    </div>
                </div>

            </div>

            <br>

            <!-- Produtos -->
            <h2>Produtos com estoque baixo</h2>

            <table class="table table-bordered">

                <tr>
                    <th>Produto</th>
                    <th>Preço</th>
                    <th>Estoque</th>
                </tr>

                <tr>
                    <td>Arroz</td>
                    <td>R$ 25,00</td>
                    <td>5</td>
                </tr>

                <tr>
                    <td>Feijão</td>
                    <td>R$ 8,00</td>
                    <td>3</td>
                </tr>

                <tr>
                    <td>Leite</td>
                    <td>R$ 5,50</td>
                    <td>2</td>
                </tr>

            </table>

        </div>

    </div>

</div>

</body>
</html>
