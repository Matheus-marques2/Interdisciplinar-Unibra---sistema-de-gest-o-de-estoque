<!DOCTYPE html>
<html lang="pt-br">

<head>

    <!-- Define a codificação -->
    <meta charset="UTF-8">

    <!-- Título da página -->
    <title>Estoque</title>

    <!-- Importa o Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>


<!-- ========================= -->
<!-- SIDEBAR -->
<!-- ========================= -->

<div class="container-fluid">

    <div class="row">

        <!-- Menu lateral -->
        <div class="col-2 bg-dark text-white min-vh-100 p-3">

            <h3>Mercado</h3>

            <hr>

            <!-- Dashboard -->
            <a href="Dashboard.html"
               class="d-block text-white mb-3">
                Dashboard
            </a>

            <!-- Estoque -->
            <a href="Estoque.html"
               class="d-block text-white mb-3">
                Estoque
            </a>

            <!-- Fornecedor -->
            <a href="Fornecedor.html"
               class="d-block text-white">
                Fornecedor
            </a>

        </div>


        <!-- ========================= -->
        <!-- CONTEÚDO -->
        <!-- ========================= -->

        <div class="col-10 p-4">

            <!-- Título -->
            <h1>Estoque</h1>

            <hr>


            <!-- ========================= -->
            <!-- FORMULÁRIO -->
            <!-- ========================= -->

            <h2>Adicionar Produto</h2>


            <form id="Formulario">


                <!-- Nome do produto -->
                <div class="mb-3">

                    <label class="form-label">
                        Nome do Produto
                    </label>

                    <input
                        type="text"
                        id="nome"
                        class="form-control"
                        required>

                </div>


                <!-- Fornecedor -->
                <div class="mb-3">

                    <label class="form-label">
                        Fornecedor
                    </label>

                    <input
                        type="text"
                        id="fornecedor"
                        class="form-control"
                        required>

                </div>


                <!-- Marca -->
                <div class="mb-3">

                    <label class="form-label">
                        Marca
                    </label>

                    <input
                        type="text"
                        id="marca"
                        class="form-control"
                        required>

                </div>


                <!-- Preço -->
                <div class="mb-3">

                    <label class="form-label">
                        Preço
                    </label>

                    <input
                        type="number"
                        id="preco"
                        class="form-control"
                        step="0.01"
                        required>

                </div>


                <!-- Botão -->
                <button
                    type="submit"
                    class="btn btn-primary">

                    Cadastrar

                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>
