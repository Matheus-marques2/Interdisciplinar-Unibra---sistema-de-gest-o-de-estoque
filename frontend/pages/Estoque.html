<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Estoque</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Menu lateral -->
        <div class="col-2 bg-dark text-white min-vh-100 p-3 d-flex flex-column">

            <h3>Mercado</h3>

            <hr>

            <a href="Dashboard.html" class="d-block text-white mb-3">Dashboard</a>
            <a href="Pdv.html" class="d-block text-white mb-3">PDV - Vendas</a>
            <a href="Produtos.html" class="d-block text-white mb-3">Produtos</a>
            <a href="Estoque.html" class="d-block text-white mb-3 fw-bold">Estoque</a>
            <a href="Fornecedor.html" class="d-block text-white">Fornecedor</a>

            <div class="mt-auto pt-3">
                <hr>
                <small id="usuarioLogado" class="d-block mb-2 text-white-50">Carregando...</small>
                <button onclick="sair()" class="btn btn-outline-light btn-sm w-100">Sair</button>
            </div>

        </div>


        <!-- CONTEÚDO -->
        <div class="col-10 p-4">

            <h1>Estoque</h1>

            <hr>

            <div id="mensagemErro" class="alert alert-danger d-none" role="alert"></div>
            <div id="mensagemSucesso" class="alert alert-success d-none" role="alert"></div>


            <!-- FORMULÁRIO -->
            <h2 id="tituloFormulario">Adicionar Produto</h2>

            <form id="formProduto" class="row g-3">

                <input type="hidden" id="produtoId">

                <div class="col-md-4">
                    <label class="form-label">Código de barras</label>
                    <input type="text" id="codigo_barras" class="form-control" required>
                </div>

                <div class="col-md-8">
                    <label class="form-label">Nome do Produto</label>
                    <input type="text" id="nome" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Marca</label>
                    <input type="text" id="marca" class="form-control">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Categoria</label>
                    <input type="text" id="categoria" class="form-control" placeholder="Ex: Alimentos, Bebidas...">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Fornecedor</label>
                    <select id="fornecedor_id" class="form-select">
                        <option value="">Sem fornecedor</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Preço</label>
                    <input type="number" id="preco" class="form-control" step="0.01" min="0" required>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Estoque atual</label>
                    <input type="number" id="estoque" class="form-control" min="0" value="0" required>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Estoque mínimo</label>
                    <input type="number" id="estoque_minimo" class="form-control" min="0" value="0">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Validade</label>
                    <input type="date" id="validade" class="form-control">
                </div>

                <div class="col-12">
                    <button type="submit" id="botaoSalvar" class="btn btn-primary">Cadastrar</button>
                    <button type="button" id="botaoCancelar" class="btn btn-secondary d-none">Cancelar edição</button>
                </div>

            </form>

            <hr class="my-4">

            <!-- LISTAGEM -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="mb-0">Produtos cadastrados</h2>
                <input type="search" id="campoBusca" class="form-control w-25" placeholder="Buscar produto...">
            </div>

            <table class="table table-bordered table-hover">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Produto</th>
                        <th>Fornecedor</th>
                        <th>Categoria</th>
                        <th>Preço</th>
                        <th>Estoque</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="corpoProdutos">
                    <tr><td colspan="7" class="text-center text-muted">Carregando...</td></tr>
                </tbody>
            </table>

        </div>

    </div>

</div>

<script src="../js/api/api.js"></script>
<script src="../js/util.js"></script>
<script src="../js/auth/session.js"></script>
<script src="../js/estoque/estoque.js"></script>

</body>
</html>
