<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Auditoria</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Menu lateral -->
        <div class="col-2 bg-dark text-white min-vh-100 p-3 d-flex flex-column">

            <h3>Mercado</h3>

            <hr>

            <a href="Dashboard.html" class="d-block text-white mb-3">Dashboard</a>
            <a href="Pdv.html" class="d-block text-white mb-3">PDV - Vendas</a>
            <a href="Produtos.html" class="d-block text-white mb-3">Produtos</a>
            <a href="Estoque.html" class="d-block text-white mb-3">Estoque</a>
            <a href="Fornecedor.html" class="d-block text-white mb-3">Fornecedor</a>
            <a href="Auditoria.html" id="linkAuditoria" class="d-block text-white fw-bold">Auditoria</a>

            <div class="mt-auto pt-3">
                <hr>
                <small id="usuarioLogado" class="d-block mb-2 text-white-50">Carregando...</small>
                <button onclick="sair()" class="btn btn-outline-light btn-sm w-100">Sair</button>
            </div>

        </div>


        <!-- CONTEÚDO -->
        <div class="col-10 p-4">

            <h1>Trilha de Auditoria</h1>
            <p class="text-muted">Histórico de ações críticas do sistema: quem fez o quê e quando.</p>

            <hr>

            <div id="mensagemErro" class="alert alert-danger d-none" role="alert"></div>
            <div id="avisoNegado" class="alert alert-warning d-none" role="alert">
                Essa área é restrita a administradores.
            </div>

            <div class="row mb-3 g-2">
                <div class="col-md-3">
                    <select id="filtroEntidade" class="form-select">
                        <option value="">Todas as entidades</option>
                        <option value="produto">Produto</option>
                        <option value="fornecedor">Fornecedor</option>
                        <option value="venda">Venda</option>
                        <option value="usuario">Usuário</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button id="botaoAtualizar" class="btn btn-outline-secondary">Atualizar</button>
                </div>
            </div>

            <table class="table table-bordered table-sm">
                <thead>
                    <tr>
                        <th>Data/Hora</th>
                        <th>Usuário</th>
                        <th>Ação</th>
                        <th>Entidade</th>
                        <th>Detalhes</th>
                        <th>IP</th>
                    </tr>
                </thead>
                <tbody id="corpoLogs">
                    <tr><td colspan="6" class="text-center text-muted">Carregando...</td></tr>
                </tbody>
            </table>

        </div>

    </div>

</div>

<script src="../js/api/api.js"></script>
<script src="../js/util.js"></script>
<script src="../js/auth/session.js"></script>
<script src="../js/auditoria/auditoria.js"></script>

</body>
</html>
