<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Auditoria</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cinza-escuro: #1f3d2e;
            --cinza: #1f7a3e;
        }

        /* ---------- Sidebar ---------- */
        .sidebar { font-family: 'DM Sans', system-ui, sans-serif;
            background: var(--cinza-escuro);
            color: #fff;
        }

        @media (min-width: 992px) {
            .sidebar { position: sticky; top: 0; height: 100vh; }
        }

        .marca {
            font-size: 1.35rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: .6rem;
        }

        .marca i {
            background: var(--cinza);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-size: 1.1rem;
        }

        .menu-link {
            display: flex;
            align-items: center;
            gap: .75rem;
            padding: .65rem .85rem;
            border-radius: 10px;
            color: rgba(255, 255, 255, .72);
            text-decoration: none;
            font-weight: 500;
            transition: background .15s, color .15s;
        }

        .menu-link:hover { background: rgba(255, 255, 255, .08); color: #fff; }

        .menu-link.ativo {
            background: #fff;
            color: var(--cinza-escuro);
            font-weight: 700;
        }

        .menu-link:focus-visible,
        .sidebar .btn:focus-visible { outline: 3px solid #a9d4b9; outline-offset: 2px; }

        .usuario {
            background: rgba(255, 255, 255, .07);
            border-radius: 12px;
            padding: .8rem;
        }

        /* ---------- Botões verdes ---------- */
        .btn-primary {
            --bs-btn-bg: #2e7d4f;
            --bs-btn-border-color: #2e7d4f;
            --bs-btn-hover-bg: #256b43;
            --bs-btn-hover-border-color: #256b43;
            --bs-btn-active-bg: #1f5c3a;
            --bs-btn-active-border-color: #1f5c3a;
            --bs-btn-disabled-bg: #2e7d4f;
            --bs-btn-disabled-border-color: #2e7d4f;
            --bs-btn-focus-shadow-rgb: 46, 125, 79;
        }
    </style>
</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Menu lateral -->
        <aside class="col-12 col-lg-2 sidebar p-3 d-flex flex-column">

            <div class="marca mb-3 mb-lg-4">
                <i class="bi bi-basket2-fill"></i>
                <span>Mercado</span>
            </div>

            <nav class="d-flex flex-row flex-lg-column flex-wrap gap-1" aria-label="Menu principal">
                <a href="Dashboard.html" class="menu-link"><i class="bi bi-speedometer2"></i>Dashboard</a>
                <a href="Pdv.html" class="menu-link"><i class="bi bi-cart3"></i>PDV - Vendas</a>
                <a href="Produtos.html" class="menu-link"><i class="bi bi-box-seam"></i>Produtos</a>
                <a href="Estoque.html" class="menu-link"><i class="bi bi-boxes"></i>Estoque</a>
                <a href="Fornecedor.html" class="menu-link"><i class="bi bi-truck"></i>Fornecedor</a>
                <a href="Auditoria.html" id="linkAuditoria" class="menu-link ativo d-none"><i class="bi bi-shield-check"></i>Auditoria</a>
            </nav>

            <div class="mt-3 mt-lg-auto">
                <div class="usuario">
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <i class="bi bi-person-circle fs-4"></i>
                        <small id="usuarioLogado" class="text-white-50">Carregando...</small>
                    </div>
                    <button onclick="sair()" class="btn btn-outline-light btn-sm w-100">
                        <i class="bi bi-box-arrow-right me-1"></i>Sair
                    </button>
                </div>
            </div>

        </aside>


        <!-- CONTEÚDO -->
        <div class="col-12 col-lg-10 p-4">

            <h1>Trilha de Auditoria</h1>
            <p class="text-muted">Histórico de ações críticas do sistema: quem fez o quê e quando.</p>

            <hr>

            <div id="mensagemErro" class="alert alert-danger d-none" role="alert"></div>
            <div id="avisoNegado" class="alert alert-warning d-none" role="alert">
                <i class="bi bi-lock me-1"></i>Essa área é restrita a administradores.
            </div>

            <!-- FILTROS -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="mb-0">Registros</h2>

                <div class="d-flex gap-2 w-50 justify-content-end">
                    <select id="filtroEntidade" class="form-select w-50">
                        <option value="">Todas as entidades</option>
                        <option value="produto">Produto</option>
                        <option value="fornecedor">Fornecedor</option>
                        <option value="venda">Venda</option>
                        <option value="usuario">Usuário</option>
                    </select>
                    <button id="botaoAtualizar" type="button" class="btn btn-primary text-nowrap">
                        <i class="bi bi-arrow-clockwise me-1"></i>Atualizar
                    </button>
                </div>
            </div>

            <table class="table table-bordered table-hover">
                <thead>
                    <tr>
                        <th>Data/Hora</th>
                        <th>Usuário</th>
                        <th>Ação</th>
                        <th>Entidade</th>
                        <th>Detalhes</th>
                        <th>IP</th>
                    </tr>
                </thead>
                <tbody id="corpoLogs">
                    <tr><td colspan="6" class="text-center text-muted">Carregando...</td></tr>
                </tbody>
            </table>

        </div>

    </div>

</div>


<script src="../js/api/api.js"></script>
<script src="../js/util.js"></script>
<script src="../js/auth/session.js"></script>
<script src="../js/auditoria/auditoria.js"></script>

</body>
</html>
