<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro - Mercado</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="col-md-4">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h3 class="text-center mb-4">Criar conta</h3>

                    <div id="mensagemErro" class="alert alert-danger d-none" role="alert"></div>
                    <div id="mensagemSucesso" class="alert alert-success d-none" role="alert"></div>

                    <form id="formCadastro">

                        <div class="mb-3">
                            <label class="form-label">Nome</label>
                            <input type="text" id="nome" class="form-control" required autofocus>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Senha</label>
                            <input type="password" id="senha" class="form-control" minlength="6" required>
                            <div class="form-text">Mínimo de 6 caracteres.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Cargo</label>
                            <select id="cargo" class="form-select">
                                <option value="operador" selected>Operador de caixa</option>
                                <option value="admin">Administrador</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Cadastrar</button>

                    </form>

                    <p class="text-center mt-3 mb-0">
                        Já tem conta? <a href="Login.html">Entrar</a>
                    </p>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="../js/api/api.js"></script>
<script src="../js/auth/cadastro.js"></script>

</body>
</html>
