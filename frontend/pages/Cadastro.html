
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro - Mercado</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body { background: #1f3d2e; }
        .logo { width: 56px; height: 56px; background: #ffd23f; color: #0f4d2a; font-size: 1.7rem; }
        .btn-verde { background: #1f7a3e; color: #fff; }
        .btn-verde:hover { background: #0f4d2a; color: #fff; }
        a { color: #1f7a3e; }
        .form-check-input:checked { background-color: #1f7a3e; border-color: #1f7a3e; }
    </style>
</head>

<body>

<div class="container d-flex align-items-center justify-content-center py-4" style="min-height: 100vh;">
    <div class="card border-0 shadow w-100" style="max-width: 380px;">
        <div class="card-body p-4">

            <div class="text-center mb-4">
                <div class="logo rounded-circle d-inline-flex align-items-center justify-content-center mb-2">
                    <i class="bi bi-basket2-fill"></i>
                </div>
                <h3 class="fw-bold mb-0">Criar conta</h3>
                <p class="text-muted mb-0">Preencha os dados abaixo</p>
            </div>

            <div id="mensagemErro" class="alert alert-danger d-none" role="alert"></div>
            <div id="mensagemSucesso" class="alert alert-success d-none" role="alert"></div>

            <form id="formCadastro">
                <div class="mb-3">
                    <label class="form-label" for="nome">Nome</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" id="nome" class="form-control" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="email" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="senha">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" id="senha" class="form-control" minlength="6" required>
                    </div>
                    <div class="form-text">Mínimo de 6 caracteres.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="cargo">Cargo</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                        <select id="cargo" class="form-select">
                            <option value="operador" selected>Operador de caixa</option>
                            <option value="admin">Administrador</option>
                        </select>
                    </div>
                </div>

                <div class="form-check mb-4">
                    <input type="checkbox" id="aceiteTermos" class="form-check-input" required>
                    <label for="aceiteTermos" class="form-check-label">
                        Li e aceito a <a href="PoliticaPrivacidade.html" target="_blank">Política de Privacidade</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-verde w-100">Cadastrar</button>
            </form>

            <p class="text-center mt-3 mb-0">
                Já tem conta? <a href="Login.html">Entrar</a>
            </p>

        </div>
    </div>
</div>

<script src="../js/api/api.js"></script>
<script src="../js/auth/cadastro.js"></script>

</body>
</html>
